services:
  app:
    build: .
    image: hello-station:${RELEASE_ID:-local}
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - station-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  station-data:
