name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hello-station-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: docker build -t hello-station:test .
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Build release image
        env:
          RELEASE_ID: ${{ github.sha }}
        run: docker build -t "hello-station:$RELEASE_ID" .
      - name: Upload and deploy this commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          docker save "hello-station:$RELEASE_ID" | gzip | ssh "$DEPLOY_USER@$DEPLOY_HOST" "gunzip | docker load"
          git archive "$RELEASE_ID" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/hello-station/releases/$RELEASE_ID && tar -xf - -C ~/hello-station/releases/$RELEASE_ID"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/hello-station/releases/$RELEASE_ID/deploy/deploy.sh $RELEASE_ID"
